server:
  port: 8080

spring:
  application:
    name: ai-code-reviewer
  datasource:
    url: jdbc:mysql://localhost:3306/aicode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aicode}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

logging:
  level:
    root: INFO
    com.aicode.reviewer: DEBUG

github:
  api-url: https://api.github.com
  token: ${GITHUB_TOKEN:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  bot-user: ${GITHUB_BOT_USER:aicode-reviewer-bot}

llm:
  provider: ${LLM_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-3-haiku-20240307}

reviewer:
  max-files: 150
  max-diff-size: 20000
  risk-thresholds:
    low: 30
    medium: 60
  notifications-enabled: true
