spring.application.name=ai-code-reviewer

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/ai_code_reviewer}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

app.ai.provider=${AI_PROVIDER:openai}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.api-key=${LLM_API_KEY:}
app.ai.mock-mode=${AI_MOCK_MODE:true}
app.ai.request-timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.system-prompt=${AI_SYSTEM_PROMPT:You are an expert code reviewer who responds in JSON.}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Structured logging makes it easier to trace review requests
logging.pattern.level=%5p [reviewer]
